name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            echo "Validando $f"
            bunx --yes js-yaml "$f" > /dev/null
          done
          echo "Todos os workflows possuem YAML válido."

      - name: Validate migration ordering
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            [ -e "$f" ] || continue
            base="$(basename "$f" .sql)"
            num="$(echo "$base" | grep -oE '^[0-9]+' || echo '0')"
            rest="$(echo "$base" | sed -E 's/^[0-9]+_?//')"
            printf '2026010100%04d_%s.sql\n' "$((10#$num))" "$rest"
          done | sort -c
          echo "Nomes de migrations mapeiam para uma ordem cronológica válida."
