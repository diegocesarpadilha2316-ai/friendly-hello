name: DB Baseline (read-only)

on:
  workflow_dispatch:
    inputs:
      schema:
        description: "Schema a extrair (somente leitura)"
        required: true
        default: "public"
        type: string

permissions:
  contents: read

concurrency:
  group: db-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Gerar baseline via supabase db pull
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Validar secrets obrigatorios
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN nao configurado"
            missing=1
          fi
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "::error::Secret SUPABASE_PROJECT_REF nao configurado"
            missing=1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD nao configurado"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          echo "Todos os secrets obrigatorios estao presentes."

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Versao da CLI
        run: supabase --version

      - name: Snapshot das migrations existentes (antes)
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          find supabase/migrations -type f -name '*.sql' | sort > /tmp/before.txt
          echo "Arquivos SQL existentes antes do pull:"
          cat /tmp/before.txt || true

      - name: Conectar ao projeto Supabase (link)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${SUPABASE_DB_PASSWORD}"
          echo "Projeto vinculado com sucesso."

      - name: Executar supabase db pull (somente leitura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db pull --schema "${{ inputs.schema }}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Identificar arquivo gerado e coletar metricas
        id: metrics
        run: |
          set -euo pipefail
          find supabase/migrations -type f -name '*.sql' | sort > /tmp/after.txt
          comm -13 /tmp/before.txt /tmp/after.txt > /tmp/new.txt || true

          if [ ! -s /tmp/new.txt ]; then
            echo "::error::Nenhum arquivo SQL foi gerado pelo supabase db pull."
            exit 1
          fi

          mkdir -p baseline-output
          echo "=============================================="
          echo "ARQUIVOS GERADOS PELO DB PULL"
          echo "=============================================="

          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            lines=$(wc -l < "${file}" | tr -d ' ')
            bytes=$(wc -c < "${file}" | tr -d ' ')
            human=$(du -h "${file}" | cut -f1)

            echo ""
            echo "Caminho do arquivo : ${file}"
            echo "Nome do arquivo    : $(basename "${file}")"
            echo "Tamanho            : ${bytes} bytes (${human})"
            echo "Linhas             : ${lines}"
            echo "----------------------------------------------"
            echo "VERIFICACOES DE CONTEUDO"
            echo "CREATE TABLE             : $(grep -c -i 'CREATE TABLE' "${file}" || true)"
            echo "CREATE FUNCTION          : $(grep -c -i -E 'CREATE (OR REPLACE )?FUNCTION' "${file}" || true)"
            echo "CREATE TRIGGER           : $(grep -c -i 'CREATE TRIGGER' "${file}" || true)"
            echo "CREATE POLICY            : $(grep -c -i 'CREATE POLICY' "${file}" || true)"
            echo "ENABLE ROW LEVEL SECURITY: $(grep -c -i 'ENABLE ROW LEVEL SECURITY' "${file}" || true)"
            echo "CREATE INDEX             : $(grep -c -i 'CREATE .*INDEX' "${file}" || true)"
            echo "CREATE TYPE              : $(grep -c -i 'CREATE TYPE' "${file}" || true)"
            echo "----------------------------------------------"

            cp "${file}" "baseline-output/$(basename "${file}")"
          done < /tmp/new.txt

          main_file=$(tail -n 1 /tmp/new.txt)
          echo "baseline_file=${main_file}" >> "$GITHUB_OUTPUT"

      - name: Resumo do baseline
        run: |
          set -euo pipefail
          file="${{ steps.metrics.outputs.baseline_file }}"
          lines=$(wc -l < "${file}" | tr -d ' ')
          bytes=$(wc -c < "${file}" | tr -d ' ')

          {
            echo "## Baseline gerado (read-only)"
            echo ""
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Caminho | \`${file}\` |"
            echo "| Arquivo | \`$(basename "${file}")\` |"
            echo "| Linhas | ${lines} |"
            echo "| Tamanho | ${bytes} bytes |"
            echo "| CREATE TABLE | $(grep -c -i 'CREATE TABLE' "${file}" || true) |"
            echo "| CREATE FUNCTION | $(grep -c -i -E 'CREATE (OR REPLACE )?FUNCTION' "${file}" || true) |"
            echo "| CREATE TRIGGER | $(grep -c -i 'CREATE TRIGGER' "${file}" || true) |"
            echo "| CREATE POLICY | $(grep -c -i 'CREATE POLICY' "${file}" || true) |"
            echo "| ENABLE ROW LEVEL SECURITY | $(grep -c -i 'ENABLE ROW LEVEL SECURITY' "${file}" || true) |"
            echo ""
            echo "Nenhum db push, migration repair ou commit foi executado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar baseline como artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-baseline-sql
          path: baseline-output/
          if-no-files-found: error
          retention-days: 30

      - name: Confirmacao final
        run: |
          echo "Baseline gerado e publicado como artifact 'supabase-baseline-sql'."
          echo "Nenhuma alteracao foi feita no banco de dados."
          echo "Nenhum commit automatico foi realizado."
