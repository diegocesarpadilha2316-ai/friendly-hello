name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets
        run: |
          set -e
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret: $v"
              exit 1
            fi
          done

      - name: Prepare supabase/migrations from db/migrations
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          if [ -d db/migrations ]; then
            for f in db/migrations/*.sql; do
              [ -e "$f" ] || continue
              base="$(basename "$f" .sql)"
              # Supabase CLI expects timestamped filenames: <YYYYMMDDHHMMSS>_name.sql
              # Map "NNN_name.sql" -> "202601010000NN_name.sql" (stable, ordered).
              num="$(echo "$base" | grep -oE '^[0-9]+' || echo '0')"
              rest="$(echo "$base" | sed -E 's/^[0-9]+_?//')"
              padded="$(printf '%04d' "$num")"
              ts="20260101${padded:0:2}${padded:2:2}00"
              # Pad to 14 digits
              ts="$(printf '%-14s' "$ts" | tr ' ' '0')"
              cp "$f" "supabase/migrations/${ts}_${rest}.sql"
            done
          fi
          ls -la supabase/migrations || true

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all