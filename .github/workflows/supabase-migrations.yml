name: Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente validar (não aplica migrations)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets
        run: |
          set -e
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret: $v"
              exit 1
            fi
          done

      - name: Prepare supabase/migrations from db/migrations
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          if [ -d db/migrations ]; then
            for f in db/migrations/*.sql; do
              [ -e "$f" ] || continue
              base="$(basename "$f" .sql)"
              # Supabase CLI expects timestamped filenames: <YYYYMMDDHHMMSS>_name.sql
              # Map "NNN_name.sql" -> "2026010100NNNN_name.sql" (stable, ordered).
              num="$(echo "$base" | grep -oE '^[0-9]+' || echo '0')"
              rest="$(echo "$base" | sed -E 's/^[0-9]+_?//')"
              # 10# forces base-10 so "008"/"009" are not parsed as octal.
              target="$(printf '2026010100%04d_%s.sql' "$((10#$num))" "$rest")"
              cp "$f" "supabase/migrations/${target}"
            done
          fi
          ls -la supabase/migrations || true

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run (validação apenas)
        if: ${{ inputs.dry_run }}
        run: |
          supabase migration list --password "$SUPABASE_DB_PASSWORD"
          echo "Dry run concluído — nenhuma alteração aplicada ao banco."

      - name: Push migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
